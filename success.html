<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - ClickPEqR</title>
    <link rel="icon" href="Icon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100 text-center space-y-6">
        <!-- Brand Logo / Icon -->
        <div class="flex justify-center">
            <img src="Icon.png" alt="ClickPEqR Logo" class="w-16 h-16 rounded-2xl object-cover bg-emerald-50 p-2 shadow-sm border border-emerald-100">
        </div>

        <!-- Success Heading -->
        <div>
            <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full uppercase">Verified Transaction</span>
            <h1 class="text-2xl font-extrabold text-slate-900 mt-3">Payment Successful!</h1>
            <p class="text-sm text-slate-500 mt-1">Thank you. Your transaction has been securely processed via ClickPEqR (Zenova Peak Tech Hub).</p>
        </div>

        <!-- Details Box -->
        <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 text-left space-y-2 text-sm">
            <div class="flex justify-between">
                <span class="text-slate-500">Status:</span>
                <span class="font-semibold text-emerald-600">Completed ✓</span>
            </div>
            <div class="flex justify-between">
                <span class="text-slate-500">Gateway:</span>
                <span class="font-semibold text-slate-700">Flutterwave Secure</span>
            </div>
        </div>

        <!-- Action Button -->
        <div>
            <a href="/" class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition text-center shadow-md">
                Back to Home / Merchant Portal
            </a>
        </div>
        
        <p class="text-xs text-slate-400">Powered by Altra AI Automation Platform</p>
    </div>

</body>
</html>
