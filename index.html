<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickPEqR - Altra AI Automation</title>
    <link rel="icon" href="Icon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-teal-900 via-teal-800 to-emerald-900 min-h-screen font-sans text-slate-100 flex items-center justify-center p-4">

    <!-- Mobile App Container Frame -->
    <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-md rounded-3xl shadow-2xl border border-teal-500/30 overflow-hidden flex flex-col min-h-[650px]">
        
        <!-- App Header -->
        <div class="bg-gradient-to-r from-teal-800 to-emerald-800 p-5 text-white flex justify-between items-center border-b border-teal-700/50">
            <div class="flex items-center space-x-3">
                <img src="Icon.png" alt="Logo" class="w-10 h-10 rounded-xl object-cover bg-white/10 p-1 border border-white/20 shadow">
                <div>
                    <h1 class="font-bold text-lg tracking-wide leading-tight">ClickPEqR</h1>
                    <span class="text-[10px] text-teal-300 tracking-wider uppercase">Zenova Peak Tech Hub</span>
                </div>
            </div>
            <div id="nav-user" class="hidden">
                <button onclick="logout()" class="text-xs bg-teal-950/60 hover:bg-teal-950 text-teal-200 px-3 py-1.5 rounded-lg border border-teal-700/50 transition">Logout</button>
            </div>
        </div>

        <!-- App Body Content -->
        <div class="p-6 flex-1 flex flex-col justify-center">

            <!-- 1. AUTH / LOGIN / SIGNUP VIEW -->
            <div id="auth-section" class="space-y-6">
                <div class="text-center space-y-1">
                    <span class="bg-teal-500/20 text-teal-300 text-[11px] font-semibold px-3 py-1 rounded-full uppercase border border-teal-500/30">Altra AI Powered</span>
                    <h2 class="text-2xl font-bold tracking-tight text-white mt-2">Merchant Portal</h2>
                    <p class="text-xs text-teal-200/70">Sign in or register for instant Scan & Pay automation</p>
                </div>

                <!-- Tabs -->
                <div class="flex bg-teal-950/60 p-1 rounded-xl border border-teal-800/50">
                    <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 text-xs font-bold text-white bg-teal-700 rounded-lg shadow transition">Sign In</button>
                    <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 py-2 text-xs font-bold text-teal-300/70 hover:text-white transition">Sign Up & KYC</button>
                </div>

                <!-- Login Form -->
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-teal-200 mb-1">Business Email</label>
                        <input type="email" id="login-email" required class="w-full px-4 py-2.5 bg-teal-950/50 border border-teal-700/50 rounded-xl text-sm focus:ring-2 focus:ring-teal-400 focus:outline-none text-white placeholder-teal-600" placeholder="business@email.com">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-600 hover:to-emerald-700 text-white font-semibold py-3 rounded-xl text-sm shadow-lg transition">Login to App</button>
                </form>

                <!-- Sign Up & KYC Form -->
                <form id="signup-form" onsubmit="handleRegister(event)" class="space-y-3 hidden">
                    <div>
                        <label class="block text-xs font-medium text-teal-200 mb-1">Business Name</label>
                        <input type="text" id="reg-business" required class="w-full px-3 py-2 bg-teal-950/50 border border-teal-700/50 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-teal-400 text-white" placeholder="Zenova Peak Tech Hub">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-teal-200 mb-1">Business Email</label>
                        <input type="email" id="reg-email" required class="w-full px-3 py-2 bg-teal-950/50 border border-teal-700/50 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-teal-400 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-teal-200 mb-1">Phone Number</label>
                        <input type="text" id="reg-phone" required class="w-full px-3 py-2 bg-teal-950/50 border border-teal-700/50 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-teal-400 text-white" value="+2349067862223">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-teal-200 mb-1">Bank</label>
                            <select id="reg-bank" class="w-full px-2 py-2 bg-teal-950/50 border border-teal-700/50 rounded-xl text-xs text-white focus:outline-none">
                                <option value="058">GTBank</option>
                                <option value="033">UBA</option>
                                <option value="044">Access</option>
                                <option value="057">Zenith</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-teal-200 mb-1">Account No</label>
                            <input type="text" id="reg-account" required maxlength="10" class="w-full px-2 py-2 bg-teal-950/50 border border-teal-700/50 rounded-xl text-xs text-white focus:outline-none" placeholder="0123456789">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-semibold py-2.5 rounded-xl text-xs shadow-lg transition mt-2">Complete KYC & Register</button>
                </form>
            </div>

            <!-- 2. DASHBOARD VIEW (Hidden initially) -->
            <div id="dashboard-section" class="hidden space-y-4">
                <div class="bg-teal-950/60 p-4 rounded-2xl border border-teal-800/50">
                    <h3 id="dash-business-name" class="font-bold text-base text-white">Business Dashboard</h3>
                    <p class="text-xs text-emerald-400 font-medium mt-0.5">✓ KYC Verified & Active</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-teal-950/40 p-3.5 rounded-2xl border border-teal-800/40">
                        <span class="text-[11px] text-teal-300">Total Volume</span>
                        <p class="text-lg font-extrabold text-white mt-1">₦ 0.00</p>
                    </div>
                    <div class="bg-teal-950/40 p-3.5 rounded-2xl border border-teal-800/40">
                        <span class="text-[11px] text-teal-300">Transactions</span>
                        <p class="text-lg font-extrabold text-teal-400 mt-1">0</p>
                    </div>
                </div>

                <!-- Generate Link Panel -->
                <div class="bg-teal-950/50 p-4 rounded-2xl border border-teal-800/50 space-y-3">
                    <h4 class="text-xs font-bold text-teal-200 uppercase tracking-wider">Generate Scan & Pay Link</h4>
                    <form onsubmit="generatePaymentLink(event)" class="space-y-2.5">
                        <input type="text" id="pay-phone" placeholder="Customer Phone" required class="w-full px-3 py-2 bg-slate-900 border border-teal-700/50 rounded-xl text-xs text-white focus:outline-none">
                        <input type="number" id="pay-amount" placeholder="Amount (NGN)" required class="w-full px-3 py-2 bg-slate-900 border border-teal-700/50 rounded-xl text-xs text-white focus:outline-none">
                        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-semibold py-2.5 rounded-xl text-xs shadow transition">Generate Link</button>
                    </form>
                    <div id="payment-result" class="hidden p-3 bg-slate-900 rounded-xl border border-teal-700/50">
                        <p class="text-[11px] text-teal-300 font-medium">Secure Link Generated:</p>
                        <a id="pay-link-output" href="#" target="_blank" class="text-xs text-teal-400 font-bold underline break-all block mt-1"></a>
                    </div>
                </div>
            </div>

        </div>

        <!-- App Footer Bar -->
        <div class="py-3 text-center bg-teal-950/80 border-t border-teal-800/40 text-[10px] text-teal-400/70">
            ClickPEqR App • Powered by Altra AI
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const BACKEND_URL = ""; 

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2 text-xs font-bold text-white bg-teal-700 rounded-lg shadow transition";
                tabSignup.className = "flex-1 py-2 text-xs font-bold text-teal-300/70 hover:text-white transition";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabSignup.className = "flex-1 py-2 text-xs font-bold text-white bg-teal-700 rounded-lg shadow transition";
                tabLogin.className = "flex-1 py-2 text-xs font-bold text-teal-300/70 hover:text-white transition";
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const payload = {
                business_name: document.getElementById('reg-business').value,
                email: document.getElementById('reg-email').value,
                phone_number: document.getElementById('reg-phone').value,
                settlement_bank_code: document.getElementById('reg-bank').value,
                settlement_account_number: document.getElementById('reg-account').value
            };

            const res = await fetch(`${BACKEND_URL}/api/merchant/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                alert("KYC Verified & Registered Successfully!");
                loadDashboard(data.data[0]);
            } else {
                alert("Error: " + data.error);
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            loadDashboard({ business_name: "Zenova Peak Tech Hub" });
        }

        function loadDashboard(merchant) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('nav-user').classList.remove('hidden');
            document.getElementById('dash-business-name').innerText = merchant.business_name;
        }

        function logout() {
            location.reload();
        }

        async function generatePaymentLink(e) {
            e.preventDefault();
            const payload = {
                merchant_id: 1,
                customer_phone: document.getElementById('pay-phone').value,
                amount: document.getElementById('pay-amount').value,
                email: "customer@altrai.com",
                name: "Customer"
            };

            const res = await fetch(`${BACKEND_URL}/api/payment/initiate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('payment-result').classList.remove('hidden');
                const linkOut = document.getElementById('pay-link-output');
                linkOut.href = data.payment_link;
                linkOut.innerText = data.payment_link;
            } else {
                alert("Failed to generate payment link");
            }
        }
    </script>
</body>
</html>
