<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickPEqR Merchant</title>
    <!-- App Icon / Favicon -->
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }
        h2 { margin-bottom: 5px; color: #333; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #218838; }
        #result { margin-top: 20px; }
        #result img { max-width: 150px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>ClickPEqR Merchant</h2>
        <p>Generate Dynamic Scan & Pay QR</p>

        <form id="qrForm">
            <input type="text" id="name" placeholder="Business Name" value="Lagos Store" required>
            <input type="email" id="email" placeholder="Merchant Email" value="merchant@clickpeqr.com" required>
            <input type="number" id="amount" placeholder="Amount (NGN)" value="5000" required>
            <button type="submit">Generate QR Code</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById('qrForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const amount = document.getElementById('amount').value;
            const resultDiv = document.getElementById('result');

            resultDiv.innerHTML = '<p>Generating live QR code...</p>';

            try {
                const response = await fetch('https://clickpeqr.onrender.com/api/generate-qr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: Number(amount), name, email, phone: "+2349067862223" })
                });

                const data = await response.json();
                if (data.success) {
                    resultDiv.innerHTML = `
                        <p><strong>Scan to Pay:</strong></p>
                        <img src="${data.qrCodeImage}" alt="Payment QR Code"><br><br>
                        <a href="${data.paymentLink}" target="_blank">Open Checkout Link</a>
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">Error: ${JSON.stringify(data.error)}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">Server Connection Failed!</p>`;
            }
        });
    </script>

</body>
</html>
