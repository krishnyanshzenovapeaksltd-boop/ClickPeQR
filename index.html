<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickPEqR - Altra AI Merchant Dashboard</title>
    <!-- Favicon Icon -->
    <link rel="icon" href="Icon.png" type="image/png">
    <!-- Tailwind CSS for Modern Look -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <!-- Integrated Icon.png Logo -->
                <img src="Icon.png" alt="ClickPEqR Logo" class="w-9 h-9 rounded-lg object-cover bg-white p-1 shadow">
                <div>
                    <span class="text-xl font-bold tracking-wide">ClickPEqR</span>
                    <span class="block text-[10px] text-indigo-200 tracking-wider uppercase">Zenova Peak Tech Hub</span>
                </div>
            </div>
            <div id="nav-user" class="hidden flex items-center space-x-4">
                <span id="user-display-name" class="font-medium text-sm"></span>
                <button onclick="logout()" class="bg-indigo-600 hover:bg-indigo-800 px-3 py-1.5 rounded text-sm transition">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-8">

        <!-- 1. AUTH SECTION (Sign In / Sign Up) -->
        <div id="auth-section" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 border border-slate-100">
            <div class="flex border-b mb-6">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 pb-3 font-semibold text-indigo-600 border-b-2 border-indigo-600 text-center">Sign In</button>
                <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 pb-3 font-semibold text-slate-400 text-center">Sign Up & KYC</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Business Email</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="business@email.com">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition">Login to Dashboard</button>
            </form>

            <!-- Sign Up & KYC Form -->
            <form id="signup-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Business / Company Name</label>
                    <input type="text" id="reg-business" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Krishnyansh Zenova Peak Tech Hub">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Business Email</label>
                    <input type="email" id="reg-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
                    <input type="text" id="reg-phone" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" value="+2349067862223">
                </div>
                
                <!-- Bank Integration for Settlements -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Select Bank</label>
                        <select id="reg-bank" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="058">Guaranty Trust Bank (GTB)</option>
                            <option value="033">United Bank for Africa (UBA)</option>
                            <option value="044">Access Bank</option>
                            <option value="057">Zenith Bank</option>
                            <option value="011">First Bank of Nigeria</option>
                            <option value="232">Sterling Bank</option>
                            <option value="215">Unity Bank</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Account Number</label>
                        <input type="text" id="reg-account" required maxlength="10" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="0123456789">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition">Complete KYC & Register</button>
                </div>
            </form>
        </div>

        <!-- 2. MERCHANT DASHBOARD (Hidden until login/register) -->
        <div id="dashboard-section" class="hidden space-y-6">
            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="text-slate-500 text-sm font-medium">Total Volume Collected</h3>
                    <p class="text-3xl font-bold text-slate-900 mt-2">₦ 0.00</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="text-slate-500 text-sm font-medium">Successful Transactions</h3>
                    <p class="text-3xl font-bold text-indigo-600 mt-2">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="text-slate-500 text-sm font-medium">KYC Status</h3>
                    <p class="text-emerald-600 font-semibold mt-2 flex items-center">✓ Verified & Active</p>
                </div>
            </div>

            <!-- Action Panel: Generate Scan & Pay Link -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
                <h2 class="text-lg font-bold text-slate-900 mb-4">Generate Scan & Pay Link (Altra AI Automation)</h2>
                <form onsubmit="generatePaymentLink(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Customer Phone</label>
                        <input type="text" id="pay-phone" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="+234...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Amount (NGN)</label>
                        <input type="number" id="pay-amount" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="5000">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Generate QR / Link</button>
                    </div>
                </form>

                <!-- Payment Link Result Box -->
                <div id="payment-result" class="hidden mt-4 p-4 bg-slate-50 rounded-lg border border-slate-200">
                    <p class="text-sm font-medium text-slate-600">Payment Link Generated Successfully:</p>
                    <a id="pay-link-output" href="#" target="_blank" class="text-indigo-600 underline break-all font-semibold"></a>
                </div>
            </div>
        </div>

    </main>

    <!-- Frontend Script Logic -->
    <script>
        const BACKEND_URL = "https://aapka-render-app-url.onrender.com"; // Render wala live URL yahan daal dein (jaise http://localhost:5000 local test ke liye)

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.className = "flex-1 pb-3 font-semibold text-indigo-600 border-b-2 border-indigo-600 text-center";
                tabSignup.className = "flex-1 pb-3 font-semibold text-slate-400 text-center";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabSignup.className = "flex-1 pb-3 font-semibold text-indigo-600 border-b-2 border-indigo-600 text-center";
                tabLogin.className = "flex-1 pb-3 font-semibold text-slate-400 text-center";
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const payload = {
                business_name: document.getElementById('reg-business').value,
                email: document.getElementById('reg-email').value,
                phone_number: document.getElementById('reg-phone').value,
                settlement_bank_code: document.getElementById('reg-bank').value,
                settlement_account_number: document.getElementById('reg-account').value
            };

            try {
                const res = await fetch(`${BACKEND_URL}/api/merchant/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    alert("KYC & Registration Successful!");
                    localStorage.setItem('merchant', JSON.stringify(data.data[0]));
                    loadDashboard(data.data[0]);
                } else {
                    alert("Error: " + data.error);
                }
            } catch (err) {
                alert("Server Connection Failed!");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            alert("Logged in successfully as " + email);
            loadDashboard({ business_name: "Zenova Peak Tech Hub", email: email });
        }

        function loadDashboard(merchant) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('nav-user').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = merchant.business_name;
        }

        function logout() {
            localStorage.removeItem('merchant');
            location.reload();
        }

        async function generatePaymentLink(e) {
            e.preventDefault();
            const payload = {
                merchant_id: 1,
                customer_phone: document.getElementById('pay-phone').value,
                amount: document.getElementById('pay-amount').value,
                email: "customer@gmail.com",
                name: "Customer"
            };

            try {
                const res = await fetch(`${BACKEND_URL}/api/payment/initiate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    const resultBox = document.getElementById('payment-result');
                    const linkOutput = document.getElementById('pay-link-output');
                    resultBox.classList.remove('hidden');
                    linkOutput.href = data.payment_link;
                    linkOutput.innerText = data.payment_link;
                } else {
                    alert("Payment Generation Failed");
                }
            } catch (err) {
                alert("Error connecting to payment gateway.");
            }
        }
    </script>
</body>
</html>
